<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>AnySchool status</title>
<style>
:root{--ink:#1f1a5c;--lamp:#f4a62a;--bg:#f7f6fb;--card:#fff;--text:#1b1830;--quiet:#5b5868;--line:#e1def2;--ok:#15803d;--warn:#9a5b00;--warnbg:#fdf4e3;--okbg:#e9f6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12102e;--card:#1b1842;--text:#f1effa;--quiet:#b4b0cc;--line:#2c2860;--ok:#6ddb9b;--warn:#f4c26a;--warnbg:#3a2c0e;--okbg:#10301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--ink);color:#fff;border-bottom:4px solid var(--lamp)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header .wrap{padding-top:18px;padding-bottom:18px;font-size:20px;font-weight:800;letter-spacing:-.02em}
header small{display:block;font-size:13px;font-weight:600;opacity:.8;letter-spacing:0}
.banner{margin:24px 0 20px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--okbg);color:var(--ok)}
.banner b{display:block;font-size:19px}
.banner span{color:var(--text);font-size:15px}
h2{font-size:17px;margin:24px 0 8px}
ol{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
li p{margin:4px 0 0}
.when{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet)}
footer{margin:28px 0 40px;font-size:13px;color:var(--quiet)}
footer a{color:inherit;font-weight:700}
</style>
</head>
<body>
<header><div class="wrap">anyschool<small>Status · status.anyschool.ng</small></div></header>
<main class="wrap">
<div class="banner"><b>Everything is working</b><span>No problems right now. This page is updated by hand when something breaks.</span></div>

<footer>Updated Sun 22 Nov, 11:14 (Lagos time). Need us? <a href="mailto:support@anyschool.ng">support@anyschool.ng</a><br>AnySchool by AnyHQ · © 2026</footer>
</main>
</body>
</html>
